services:
  django:
    build:
      context: .
      dockerfile: docker/local/django/Dockerfile
    container_name: docux_django
    command: /app/scripts/entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - envs/local/django.env
      - envs/local/postgres.env
      - envs/local/redis.env
    depends_on:
      - postgres
      - redis
      - ollama
      - searxng
    networks:
      - docux_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: docux_postgres
    volumes:
      - docux_postgres_data:/var/lib/postgresql/data
    env_file:
      - envs/local/postgres.env
    ports:
      - "5432:5432"
    networks:
      - docux_network

  redis:
    image: redis:7-alpine
    container_name: docux_redis
    ports:
      - "6379:6379"
    volumes:
      - docux_redis_data:/data
    networks:
      - docux_network

  celery_worker:
    build:
      context: .
      dockerfile: docker/local/django/Dockerfile
    container_name: docux_celery_worker
    command: celery -A config worker -l info -Q celery,document_processing
    volumes:
      - .:/app
    env_file:
      - envs/local/django.env
      - envs/local/postgres.env
      - envs/local/redis.env
    depends_on:
      - django
      - postgres
      - redis
      - ollama
    networks:
      - docux_network

  celery_beat:
    build:
      context: .
      dockerfile: docker/local/django/Dockerfile
    container_name: docux_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - envs/local/django.env
      - envs/local/postgres.env
      - envs/local/redis.env
    depends_on:
      - django
      - postgres
      - redis
      - ollama
    networks:
      - docux_network

  ollama:
    image: ollama/ollama:latest
    container_name: docux_ollama

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "60m"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_LOAD_TIMEOUT: "10m"

    ports:
      - "11434:11434"
    volumes:
      - docux_ollama_data:/root/.ollama
    networks:
      - docux_network


  searxng:
    image: searxng/searxng:latest
    container_name: docux_searxng
    restart: unless-stopped
    volumes:
      - ./docker/local/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8081:8080"
    networks:
      - docux_network

volumes:
  docux_postgres_data:
  docux_redis_data:
  docux_ollama_data:

networks:
  docux_network:
    driver: bridge
